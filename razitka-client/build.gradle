plugins {
    id "org.docstr.gwt" version "2.2.7"
}
compileJava {
    options.encoding = 'UTF-8'

    sourceCompatibility = 17
    targetCompatibility = 17
}

dependencies {
    implementation "org.aplikator:aplikator:1.1.29"
}

configurations.all {
    exclude group: "org.eclipse.jetty"
    exclude group: "net.sourceforge.htmlunit"
    exclude group: "jakarta.servlet"
    exclude group: "org.apache.httpcomponents.client5"
}

gwt {
    gwtVersion = '2.13.0'
    modules = ['cz.incad.razitka.Razitka']
    sourceLevel = '17'

    minHeapSize = "512M"
    maxHeapSize = "1024M"

    //style = 'PRETTY'

    superDev {
        precompile = false
    }
}



